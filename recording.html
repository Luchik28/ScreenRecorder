<!DOCTYPE html>
<html>
<head>
  <title>Reconstructed Recording</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      background: #1a1a1a;
      color: white;
      font-family: system-ui, sans-serif;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      height: 100vh;
    }
    .header {
      padding: 15px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: #2a2a2a;
      border-bottom: 1px solid #3a3a3a;
    }
    .video-container {
      position: relative;
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }
    video {
      max-width: 100%;
      max-height: 100%;
      box-shadow: 0 10px 40px rgba(0,0,0,0.5);
    }
    #purple-cursor {
      position: absolute;
      top: 0;
      left: 0;
      width: 24px;
      height: 24px;
      pointer-events: none;
      z-index: 100;
      display: none;
      will-change: transform;
    }
    .save-btn {
      background: #a855f7;
      color: white;
      border: none;
      padding: 8px 16px;
      border-radius: 6px;
      cursor: pointer;
      font-weight: 600;
      transition: background 0.2s;
    }
    .save-btn:hover {
      background: #9333ea;
    }
  </style>
</head>
<body>
  <div class="header">
    <div>Promo Screen Recorder - Replay</div>
    <button class="save-btn" id="saveBtn">Save to Downloads</button>
  </div>
  <div class="video-container" id="container">
    <video id="player" controls></video>
    <div id="purple-cursor">
      <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path d="M5.65376 12.3673L15.1533 17.8692C16.5741 18.6918 18.2562 17.3753 17.7812 15.8231L13.8827 3.08381C13.4357 1.62319 11.4116 1.48705 10.761 2.8722L5.27181 14.5458C4.69678 15.7686 5.86561 17.1524 7.15376 16.5161L5.65376 12.3673Z" fill="#a855f7" stroke="white" stroke-width="1.5"/>
      </svg>
    </div>
  </div>

  <script src="recording-view.js"></script>
</body>
</html>
