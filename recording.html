<!DOCTYPE html>
<html>
<head>
  <title>Promo Video Editor</title>
  <style>
    :root {
      --primary: #a855f7;
      --bg: #111;
      --panel: #1e1e1e;
      --border: #333;
      --text: #eee;
    }
    body {
      margin: 0;
      padding: 0;
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }
    .header {
      padding: 12px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: var(--panel);
      border-bottom: 1px solid var(--border);
      z-index: 10;
    }
    .main-editor {
      flex: 1;
      display: flex;
      position: relative;
      padding: 20px;
      gap: 20px;
      overflow: hidden;
    }
    .editor-content {
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 15px;
      min-width: 0;
    }
    .video-preview-wrapper {
      align-self: center;
    }
    .video-preview-wrapper {
      position: relative;
      max-width: 100%;
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #222;
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 10px 40px rgba(0,0,0,0.8);
      border: 1px solid var(--border);
    }
    #player {
      width: 100%;
      height: 100%;
      object-fit: contain;
      transform-origin: center center;
      will-change: transform;
    }
    #purple-cursor {
      position: absolute;
      top: 0;
      left: 0;
      pointer-events: none;
      z-index: 100;
      display: none;
      will-change: transform;
    }
    .editor-controls {
      background: var(--panel);
      border-radius: 12px;
      padding: 15px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      border: 1px solid var(--border);
    }
    .playback-buttons {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 20px;
    }
    .control-btn {
      background: none;
      border: none;
      color: var(--text);
      cursor: pointer;
      padding: 8px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background 0.2s;
    }
    .control-btn:hover { background: var(--border); }
    .control-btn svg { width: 24px; height: 24px; }
    .play-btn {
      background: var(--primary);
      width: 48px;
      height: 48px;
    }
    .play-btn:hover { background: #9333ea; }
    .timeline-section {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }
    .timeline-label {
      font-size: 10px;
      color: #888;
      padding-left: 5px;
    }
    .timeline-container {
      position: relative;
      height: 40px;
      background: #111;
      border-radius: 6px;
      border: 1px solid var(--border);
      overflow: visible;
    }
    #timeline-track {
      position: absolute;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(168, 85, 247, 0.1);
    }
    .trim-region {
      position: absolute;
      top: 0;
      bottom: 0;
      background: rgba(168, 85, 247, 0.3);
      border-left: 2px solid var(--primary);
      border-right: 2px solid var(--primary);
      pointer-events: none;
    }
    .trim-handle {
      position: absolute;
      top: 0;
      width: 12px;
      height: 100%;
      background: var(--primary);
      cursor: ew-resize;
      z-index: 5;
    }
    #handle-start { left: 0; border-radius: 6px 0 0 6px; }
    #handle-end { right: 0; border-radius: 0 6px 6px 0; }
    #playhead {
      position: absolute;
      top: 0;
      left: 0;
      width: 2px;
      height: 100%;
      background: white;
      z-index: 4;
      pointer-events: none;
    }
    .zoom-timeline {
      position: relative;
      height: 32px;
      background: #0a0a0a;
      border-radius: 4px;
      border: 1px solid var(--border);
      cursor: pointer;
    }
    .zoom-marker {
      position: absolute;
      height: 100%;
      background: rgba(59, 130, 246, 0.6);
      border: 1px solid #3b82f6;
      border-radius: 3px;
      cursor: move;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 10px;
      color: white;
      min-width: 30px;
    }
    .zoom-marker:hover { background: rgba(59, 130, 246, 0.8); }
    .zoom-marker.selected {
      background: rgba(59, 130, 246, 0.9);
      border-color: white;
      box-shadow: 0 0 0 2px rgba(59, 130, 246, 0.3);
    }
    .zoom-handle {
      position: absolute;
      top: 0;
      width: 8px;
      height: 100%;
      background: rgba(255, 255, 255, 0.3);
      cursor: ew-resize;
      z-index: 2;
    }
    .zoom-handle:hover { background: rgba(255, 255, 255, 0.5); }
    .zoom-handle.left { left: 0; border-radius: 3px 0 0 3px; }
    .zoom-handle.right { right: 0; border-radius: 0 3px 3px 0; }

    /* Settings Panel with Icon Tabs */
    .settings-panel {
      width: 280px;
      background: var(--panel);
      border-radius: 12px;
      border: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }
    .tab-buttons {
      display: flex;
      padding: 8px;
      gap: 8px;
      border-bottom: 1px solid var(--border);
      background: #1a1a1a;
    }
    .tab-btn {
      flex: 1;
      padding: 10px;
      background: transparent;
      border: 1px solid var(--border);
      border-radius: 8px;
      color: #888;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.2s;
    }
    .tab-btn:hover {
      background: rgba(168, 85, 247, 0.1);
      border-color: #555;
      color: #aaa;
    }
    .tab-btn.active {
      background: rgba(168, 85, 247, 0.2);
      border-color: var(--primary);
      color: var(--primary);
    }
    .tab-btn svg { width: 20px; height: 20px; }
    .tab-content {
      flex: 1;
      overflow-y: auto;
      padding: 15px;
    }
    .tab-pane {
      display: none;
      flex-direction: column;
      gap: 20px;
    }
    .tab-pane.active { display: flex; }
    .settings-section {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .settings-section-title {
      font-size: 11px;
      font-weight: 600;
      color: #888;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      border-bottom: 1px solid var(--border);
      padding-bottom: 8px;
    }
    .setting-row {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    .setting-row label {
      font-size: 12px;
      color: #aaa;
    }
    .setting-row input[type=range] {
      width: 100%;
      accent-color: var(--primary);
    }
    .setting-value {
      font-size: 11px;
      color: #666;
      text-align: right;
    }
    .cursor-options {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
    }
    .cursor-option {
      aspect-ratio: 1;
      background: #111;
      border: 2px solid var(--border);
      border-radius: 8px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.2s;
    }
    .cursor-option:hover { border-color: #555; }
    .cursor-option.selected {
      border-color: var(--primary);
      background: rgba(168, 85, 247, 0.1);
    }
    .cursor-option svg { width: 20px; height: 20px; }
    .color-picker-row {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }
    .color-swatch {
      width: 28px;
      height: 28px;
      border-radius: 6px;
      cursor: pointer;
      border: 2px solid transparent;
      transition: all 0.2s;
    }
    .color-swatch:hover { transform: scale(1.1); }
    .color-swatch.selected { border-color: white; }
    .color-custom {
      width: 28px;
      height: 28px;
      border-radius: 6px;
      border: 2px dashed #555;
      cursor: pointer;
    }
    .details-empty {
      text-align: center;
      padding: 40px 20px;
      color: #666;
      font-size: 13px;
    }
    .details-empty svg {
      width: 48px;
      height: 48px;
      margin-bottom: 12px;
      opacity: 0.3;
    }
    .delete-zoom-btn {
      width: 100%;
      margin-top: 10px;
      padding: 8px;
      background: rgba(239, 68, 68, 0.2);
      border: 1px solid #ef4444;
      color: #ef4444;
      border-radius: 6px;
      cursor: pointer;
      font-size: 12px;
    }
    .delete-zoom-btn:hover { background: rgba(239, 68, 68, 0.3); }
    #export-overlay {
      display: none;
      position: absolute;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0,0,0,0.9);
      z-index: 1000;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      border-radius: 12px;
    }
  </style>
</head>
<body>
  <div class="header">
    <div style="font-weight: 600; display: flex; align-items: center; gap: 10px;">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="var(--primary)"><path d="M17 10.5V7c0-.55-.45-1-1-1H4c-.55 0-1 .45-1 1v10c0 .55.45 1 1 1h12c.55 0 1-.45 1-1v-3.5l4 4v-11l-4 4z"/></svg>
      Promo Video Editor
    </div>
    <div style="display: flex; gap: 10px;">
      <button onclick="window.close()" style="background: transparent; border: 1px solid var(--border); color: #ccc; cursor: pointer; padding: 8px 16px; border-radius: 6px;">Discard</button>
      <button id="saveBtn" style="background: var(--primary); color: white; border: none; padding: 8px 16px; border-radius: 6px; cursor: pointer; font-weight: 600;">Export Video</button>
    </div>
  </div>

  <div class="main-editor">
    <div class="editor-content">
      <div class="video-preview-wrapper" id="container">
        <video id="player"></video>
        <div id="export-overlay">
          <div style="color:white; font-size:20px; font-weight:600; margin-bottom:20px;">Exporting Video with Effects...</div>
          <div id="export-stage" style="color:#a855f7; font-size:14px; margin-bottom:15px;">Preparing...</div>
          <div style="width:400px; height:6px; background:#333; border-radius:3px; overflow:hidden;">
            <div id="export-progress-bar" style="width:0%; height:100%; background:var(--primary); transition: width 0.3s;"></div>
          </div>
          <div id="export-percent" style="color:#ccc; font-size:14px; margin-top:10px;">0%</div>
        </div>
        <div id="purple-cursor"></div>
      </div>

      <div class="editor-controls">
        <div class="playback-buttons">
          <button class="control-btn" id="skipBackBtn">
            <svg viewBox="0 0 24 24" fill="currentColor"><path d="M11 18V6l-8.5 6 8.5 6zm.5-6l8.5 6V6l-8.5 6z"/></svg>
          </button>
          <button class="control-btn play-btn" id="playPauseBtn">
            <svg id="play-icon" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>
            <svg id="pause-icon" viewBox="0 0 24 24" fill="currentColor" style="display: none;"><path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/></svg>
          </button>
          <button class="control-btn" id="skipForwardBtn">
            <svg viewBox="0 0 24 24" fill="currentColor"><path d="M4 18l8.5-6L4 6v12zm9-12v12l8.5-6L13 6z"/></svg>
          </button>
        </div>
        <div class="timeline-section">
          <div class="timeline-label">Video</div>
          <div class="timeline-container" id="timeline">
            <div id="timeline-track"></div>
            <div id="trim-region" class="trim-region"></div>
            <div id="playhead"></div>
            <div class="trim-handle" id="handle-start"></div>
            <div class="trim-handle" id="handle-end"></div>
          </div>
        </div>
        <div class="timeline-section">
          <div class="timeline-label">Zoom Effects (click to add, drag edges to extend)</div>
          <div class="zoom-timeline" id="zoom-timeline"></div>
        </div>
      </div>
    </div>

    <div class="settings-panel">
      <div class="tab-buttons">
        <button class="tab-btn active" data-tab="cursor" title="Cursor Settings">
          <svg viewBox="0 0 24 24" fill="currentColor"><path d="M13.64 21.97C13.14 22.21 12.54 22 12.31 21.5L10.13 16.76L7.62 18.78C7.45 18.92 7.24 19 7 19C6.45 19 6 18.55 6 18V3C6 2.45 6.45 2 7 2C7.24 2 7.47 2.09 7.64 2.23L7.65 2.22L19.14 11.86C19.57 12.22 19.62 12.85 19.27 13.27C19.1 13.5 18.85 13.65 18.58 13.69L14.73 14.22L16.91 18.96C17.15 19.46 16.94 20.06 16.44 20.3L13.64 21.97Z"/></svg>
        </button>
        <button class="tab-btn" data-tab="details" title="Zoom Details">
          <svg viewBox="0 0 24 24" fill="currentColor"><path d="M15.5 14h-.79l-.28-.27C15.41 12.59 16 11.11 16 9.5 16 5.91 13.09 3 9.5 3S3 5.91 3 9.5 5.91 16 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/><path d="M12 10h-2v2H9v-2H7V9h2V7h1v2h2v1z"/></svg>
        </button>
      </div>
      
      <div class="tab-content">
        <div class="tab-pane active" id="cursor-tab">
          <div class="settings-section">
            <div class="settings-section-title">Cursor Style</div>
            <div class="cursor-options">
              <div class="cursor-option selected" data-cursor="windows" title="Windows">
                <svg viewBox="0 0 32 32" width="20" height="20" fill="currentColor" style="filter: drop-shadow(1px 1px 1px rgba(0,0,0,0.3));">
                  <path d="M0.5,0.5 L0.5,22.5 L6.5,16.5 L10,25.5 L13.5,24 L10,15 L17.5,15 L0.5,0.5 Z" stroke="rgba(255,255,255,0.3)" stroke-width="0.8"/>
                </svg>
              </div>
              <div class="cursor-option" data-cursor="mac" title="Mac">
                <svg viewBox="0 0 24 32" width="16" height="20" fill="currentColor" style="filter: drop-shadow(0.5px 0.5px 0.5px rgba(0,0,0,0.3));">
                  <path d="M2,0.5 L2,21.5 L8,15.5 L11,26.5 L13,25.5 L10,14.5 L16,14.5 L2,0.5 Z" stroke="rgba(255,255,255,0.3)" stroke-width="0.6"/>
                </svg>
              </div>
              <div class="cursor-option" data-cursor="dot" title="Dot">
                <div style="width:12px; height:12px; background:currentColor; border-radius:50%;"></div>
              </div>
              <div class="cursor-option" data-cursor="ring" title="Ring">
                <div style="width:14px; height:14px; border:2px solid currentColor; border-radius:50%;"></div>
              </div>
              <div class="cursor-option" data-cursor="square" title="Square">
                <div style="width:10px; height:10px; background:currentColor; border-radius:2px;"></div>
              </div>
              <div class="cursor-option" data-cursor="crosshair" title="Crosshair">
                <div style="position:relative; width:16px; height:16px;">
                  <div style="position:absolute; width:2px; height:100%; left:50%; transform:translateX(-50%); background:currentColor;"></div>
                  <div style="position:absolute; height:2px; width:100%; top:50%; transform:translateY(-50%); background:currentColor;"></div>
                </div>
              </div>
            </div>
          </div>
          <div class="settings-section">
            <div class="settings-section-title">Cursor Color</div>
            <div class="color-picker-row">
              <div class="color-swatch selected" data-color="#a855f7" style="background:#a855f7;"></div>
              <div class="color-swatch" data-color="#3b82f6" style="background:#3b82f6;"></div>
              <div class="color-swatch" data-color="#22c55e" style="background:#22c55e;"></div>
              <div class="color-swatch" data-color="#eab308" style="background:#eab308;"></div>
              <div class="color-swatch" data-color="#ef4444" style="background:#ef4444;"></div>
              <div class="color-swatch" data-color="#ffffff" style="background:#ffffff;"></div>
              <div class="color-swatch" data-color="#000000" style="background:#000000; border:1px solid #555;"></div>
              <input type="color" id="custom-color" class="color-custom" value="#a855f7" title="Custom color">
            </div>
          </div>
          <div class="settings-section">
            <div class="settings-section-title">Cursor Size</div>
            <div class="setting-row">
              <input type="range" id="cursorSize" min="16" max="64" step="2" value="24">
              <span class="setting-value" id="cursorSizeVal">24px</span>
            </div>
          </div>
          <div class="settings-section">
            <div class="settings-section-title">Default Zoom</div>
            <div class="setting-row">
              <label>Zoom Level</label>
              <input type="range" id="defaultZoomLevel" min="1.2" max="3" step="0.1" value="1.5">
              <span class="setting-value" id="defaultZoomLevelVal">1.5x</span>
            </div>
            <div class="setting-row">
              <label>Zoom Speed</label>
              <input type="range" id="defaultZoomSpeed" min="100" max="800" step="50" value="300">
              <span class="setting-value" id="defaultZoomSpeedVal">300ms</span>
            </div>
            <div class="setting-row" style="flex-direction:row; align-items:center; gap:8px;">
              <input type="checkbox" id="autoZoomCheck" checked>
              <label for="autoZoomCheck" style="margin:0;">Auto-zoom on clicks</label>
            </div>
          </div>
        </div>

        <div class="tab-pane" id="details-tab">
          <div class="details-empty" id="details-empty">
            <svg viewBox="0 0 24 24" fill="currentColor">
              <path d="M15.5 14h-.79l-.28-.27C15.41 12.59 16 11.11 16 9.5 16 5.91 13.09 3 9.5 3S3 5.91 3 9.5 5.91 16 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/>
            </svg>
            <div>Click a zoom on the timeline to edit it</div>
          </div>
          <div id="zoom-details" style="display:none;">
            <div class="settings-section">
              <div class="settings-section-title">Selected Zoom</div>
              <div class="setting-row">
                <label>Zoom Amount</label>
                <input type="range" id="selectedZoomLevel" min="1.2" max="3" step="0.1" value="1.5">
                <span class="setting-value" id="selectedZoomLevelVal">1.5x</span>
              </div>
              <div class="setting-row">
                <label>Zoom Speed</label>
                <input type="range" id="selectedZoomSpeed" min="100" max="800" step="50" value="300">
                <span class="setting-value" id="selectedZoomSpeedVal">300ms</span>
              </div>
              <div class="setting-row">
                <label>Hold Duration</label>
                <input type="range" id="selectedZoomHold" min="200" max="5000" step="100" value="1000">
                <span class="setting-value" id="selectedZoomHoldVal">1000ms</span>
              </div>
              <button class="delete-zoom-btn" id="delete-zoom-btn">Delete This Zoom</button>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script src="recording-view.js"></script>
</body>
</html>
