<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Promo Screen Recorder</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="toolbar">
    <div class="toolbar-left">
      <button id="selectWindowBtn" class="icon-btn-container active">
        <div class="icon-btn">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="currentColor">
            <rect x="2" y="3" width="20" height="18" rx="2" fill="none" stroke="currentColor" stroke-width="1.5"/>
            <rect x="2" y="3" width="20" height="5" rx="2" rx="0"/>
          </svg>
        </div>
        <span class="icon-label">Window</span>
      </button>
      <button id="fullScreenBtn" class="icon-btn-container">
        <div class="icon-btn">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
            <path d="M3 3h7v2H5v5H3V3zm18 0h-7v2h5v5h2V3zM3 21h7v-2H5v-5H3v7zm18 0h-7v-2h5v-5h2v7z"/>
          </svg>
        </div>
        <span class="icon-label">Full Screen</span>
      </button>
    </div>
    
    <div class="toolbar-center">
      <div id="selectionStatus" class="selection-status">No source selected</div>
      <div id="countdown" class="countdown"></div>
      <div id="timer" class="timer"></div>
      <button id="recordBtn" class="btn-record" disabled>
        <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor">
          <circle cx="12" cy="12" r="8"/>
        </svg>
        Record
      </button>
      <button id="stopBtn" class="btn-stop" style="display: none;">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor">
          <rect x="6" y="6" width="12" height="12" rx="2"/>
        </svg>
        Stop
      </button>
    </div>
    
    <div class="toolbar-right">
      <button id="minimizeBtn" class="btn-icon-only">−</button>
      <button id="closeBtn" class="btn-icon-only">×</button>
    </div>
  </div>

  <!-- Window Grid Overlay -->
  <div id="windowGrid" class="window-grid">
    <div id="windowGridContainer" class="window-grid-container"></div>
  </div>

  <script src="renderer.js"></script>
</body>
</html>
